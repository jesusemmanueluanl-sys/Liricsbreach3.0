name: Build from zip
on: workflow_dispatch

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q lyricsbridge.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle -p lyricsbridge/android-app assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lyricsbridge-apk
          path: lyricsbridge/android-app/app/build/outputs/apk/debug/app-debug.apk

  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q lyricsbridge.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.5.1 }
      - run: gradle -p lyricsbridge/fabric-mod build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lyricsbridge-mod
          path: |
            lyricsbridge/fabric-mod/build/libs/lyricsbridge-*.jar
            !lyricsbridge/fabric-mod/build/libs/*-sources.jar
